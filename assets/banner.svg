<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .glow-orb-1 {
      animation: floatOrb1 10s ease-in-out infinite alternate;
    }
    .glow-orb-2 {
      animation: floatOrb2 12s ease-in-out infinite alternate;
    }
    .pulse-pill {
      animation: pulseGlow 3s ease-in-out infinite alternate;
    }
    .agent-card-1 {
      animation: floatCard1 7s ease-in-out infinite alternate;
    }
    .agent-card-2 {
      animation: floatCard2 8.5s ease-in-out infinite alternate;
    }
    .signal-flow {
      stroke-dasharray: 6 12;
      animation: signalMove 15s linear infinite;
    }

    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(80px, 40px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-60px, -30px) scale(1.2); }
    }
    @keyframes pulseGlow {
      0% { opacity: 0.85; filter: drop-shadow(0 0 3px rgba(99,102,241,0.4)); }
      100% { opacity: 1; filter: drop-shadow(0 0 14px rgba(236,72,153,0.7)); }
    }
    @keyframes floatCard1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-10px); }
    }
    @keyframes floatCard2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(12px); }
    }
    @keyframes signalMove {
      from { stroke-dashoffset: 200; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Light Orbs (Deep Background) -->
  <g opacity="0.45">
    <circle class="glow-orb-1" cx="220" cy="90" r="130" fill="#6366f1" filter="url(#glow)" />
    <circle class="glow-orb-2" cx="980" cy="270" r="140" fill="#ec4899" filter="url(#glow)" />
    <circle cx="1060" cy="70" r="90" fill="#06b6d4" opacity="0.3" filter="url(#glow)" />
  </g>

  <!-- Geometric Grid & Connecting Circuits (Background Layer) -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="360" />
    <line x1="280" y1="0" x2="280" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1120" y1="0" x2="1120" y2="360" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="290" x2="1200" y2="290" />
  </g>

  <!-- Dynamic Signal Circuit Lines (Animated Flow) -->
  <path class="signal-flow" d="M 80 180 Q 200 80 340 180 T 600 180 T 880 180 T 1120 180" fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.3" />

  <!-- Dynamic Floating Decorative Cards (Positioned in Safe Margins) -->
  <!-- Top Right Card: Autonomous Resolution Metric -->
  <g class="agent-card-1" transform="translate(940, 45)">
    <rect width="200" height="68" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="34" r="10" fill="url(#emeraldGrad)" />
    <path d="M 24 34 L 27 37 L 33 30" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">RESOLUTION RATE</text>
    <text x="48" y="50" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">89.4% Autonomous</text>
  </g>

  <!-- Bottom Right Card: Outcome-Based Speed Metric -->
  <g class="agent-card-2" transform="translate(920, 245)">
    <rect width="220" height="68" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="34" r="10" fill="url(#amberGrad)" />
    <path d="M 28 27 L 28 35 L 34 35" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="48" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">AVG FIRST RESPONSE</text>
    <text x="48" y="50" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="800">&lt; 1.2s Real-Time AI</text>
  </g>

  <!-- FOREGROUND CONTENT: Guaranteed Clear & Legible Hierarchy -->
  <g transform="translate(80, 50)">
    <!-- Top Interactive Pill / Badge -->
    <g class="pulse-pill">
      <rect width="320" height="32" rx="16" fill="#1e1b4b" stroke="url(#primaryGrad)" stroke-width="1.5" />
      <circle cx="16" cy="16" r="4.5" fill="#10b981" />
      <text x="30" y="21" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="0.6">
        🤖 AUTONOMOUS AI SUPPORT AGENTS
      </text>
    </g>

    <!-- Main Title -->
    <text x="0" y="95" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" letter-spacing="-0.5">
      Awesome Autonomous Customer Service Agents
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="132" fill="url(#cyanGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">
      Enterprise AI Platforms &bull; Open-Source Copilots &bull; Outcome-Based Automation
    </text>

    <!-- Feature Description -->
    <text x="0" y="165" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      The definitive directory of multi-channel AI contact center platforms, voice copilots,
    </text>
    <text x="0" y="187" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      and self-hosted customer support agent frameworks.
    </text>

    <!-- Interactive Ecosystem Tags / Badges in Foreground -->
    <g transform="translate(0, 218)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="17" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">⚡ Voice &amp; Chat AI</text>

      <!-- Tag 2 -->
      <rect x="140" y="0" width="155" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="152" y="17" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🎯 Outcome-Based</text>

      <!-- Tag 3 -->
      <rect x="305" y="0" width="160" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="317" y="17" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🔓 Self-Hostable OSS</text>

      <!-- Tag 4 -->
      <rect x="475" y="0" width="145" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="487" y="17" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">🛡️ SOC2 &amp; Privacy</text>
    </g>
  </g>

  <!-- Border Accent -->
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1.5" />
</svg>
